
name: Build My Routine APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o MyRoutineAndroid_CloudBuild.zip -d .

      - name: Fix Java and Kotlin version
        working-directory: MyRoutineAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          marker = "    buildFeatures { compose = true }"

          replacement = """    buildFeatures { compose = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }"""

          if "jvmTarget = \"17\"" not in s:
              if marker not in s:
                  raise SystemExit("Could not find buildFeatures marker")
              s = s.replace(marker, replacement, 1)

          p.write_text(s)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Build APK
        working-directory: MyRoutineAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Routine-APK
          path: MyRoutineAndroid/app/build/outputs/apk/debug/app-debug.apk
